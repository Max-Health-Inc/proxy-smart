parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/brand.css css/idp-icons.css

# Per-organization accent. The base login template renders `scripts` into <head> without
# defer, so this runs before paint and can add its stylesheet as a render-blocking <link>
# (see resources/js/brand-accent.js). Append `?base=https://api.example.com` when the proxy
# is on a different origin from Keycloak.
scripts=js/brand-accent.js
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css
