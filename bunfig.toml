# Bun Configuration
# https://bun.sh/docs/runtime/configuration

[install]
# Use isolated installs for better monorepo dependency isolation
linker = "isolated"

# Allow newer packages for faster access to updates
# Set to 0 to disable the 7-day waiting period
# Note: This reduces supply chain attack protection
minimumReleaseAge = 0 # Allow all packages regardless of age

[install.scopes]
# Resolve @max-health-inc packages from GitHub Packages
"@max-health-inc" = "https://npm.pkg.github.com"
# The Max Network design-language contract (@max-network/css) — single source of
# the Max Health brand tokens, pulled in by @max-health-inc/shared-ui and the
# admin UI. Private GitHub Packages; auth via env (never a committed token):
#   locally  ->  NODE_AUTH_TOKEN="$(gh auth token)" bun install
#   in CI    ->  NODE_AUTH_TOKEN set to a token with read:packages
"@max-network" = { url = "https://npm.pkg.github.com/", token = "$NODE_AUTH_TOKEN" }

# Security scanner (Socket.dev)
# [install.security]
# scanner = "@socketsecurity/bun-security-scanner"

[console]
# Control console.log() depth
depth = 5

[test]
# Enable concurrent testing for I/O-bound tests
concurrentTestGlob = "**/integration/**/*.test.ts"
concurrent = true
maxConcurrency = 20
