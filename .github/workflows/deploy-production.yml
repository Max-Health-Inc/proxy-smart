name: Deploy Production

on:
  workflow_call:
    inputs:
      app_version:
        description: 'Version of the application to deploy'
        required: true
        type: string
      source_branch:
        description: 'Source branch for deployment'
        required: true
        type: string
    outputs:
      fhir_server_url:
        description: "FHIR server URL after deployment"
        value: ${{ jobs.deploy.outputs.fhir_server_url }}
      keycloak_url:
        description: "Keycloak URL after deployment"
        value: ${{ jobs.deploy.outputs.keycloak_url }}
      app_url:
        description: "Main application URL after deployment"
        value: ${{ jobs.deploy.outputs.app_url }}
      deployment_status:
        description: "Status of the deployment"
        value: ${{ jobs.deploy.outputs.deployment_status }}
      deployment_target:
        description: "Target platform where app was deployed"
        value: ${{ jobs.deploy.outputs.deployment_target }}
    secrets:
      VITE_ENCRYPTION_SECRET:
        required: true

  workflow_dispatch:
    inputs:
      app_version:
        description: 'Version to deploy (defaults to latest)'
        required: false
        default: 'latest'
      source_branch:
        description: 'Branch to deploy from'
        required: false
        default: 'main'

permissions:
  contents: read
  id-token: write
  # Needed so the Docker build can install @max-health-inc/shared-ui from GitHub Packages.
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: proxy-smart-backend
  ECR_KEYCLOAK_REPOSITORY: proxy-smart-keycloak
  ECS_CLUSTER: proxy-smart-production
  ECS_SERVICE: proxy-smart-backend
  ECS_KEYCLOAK_CLUSTER: proxy-smart-keycloak
  ECS_KEYCLOAK_SERVICE: keycloak
  PRODUCTION_URL: https://proxy-smart.com
  API_URL: https://api.proxy-smart.com
  KEYCLOAK_URL: https://auth.proxy-smart.com

jobs:
  deploy:
    name: Build, Push & Deploy to AWS ECS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      fhir_server_url: ${{ steps.outputs.outputs.fhir_server_url }}
      keycloak_url: ${{ steps.outputs.outputs.keycloak_url }}
      app_url: ${{ steps.outputs.outputs.app_url }}
      deployment_status: ${{ steps.outputs.outputs.deployment_status }}
      deployment_target: ${{ steps.outputs.outputs.deployment_target }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_branch }}

      - name: Configure AWS credentials
        # The OIDC token exchange intermittently hangs; without a cap it eats the
        # whole 30-min job timeout. Fail fast (3 min) so a hung auth is a quick,
        # cheap re-run instead of a half-hour stall.
        timeout-minutes: 3
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::579201838740:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.app_version }}
          build-args: |
            VITE_ENCRYPTION_SECRET=${{ secrets.VITE_ENCRYPTION_SECRET }}
            DEPLOY_ENV=prod
          # No GITHUB_TOKEN fallback: @max-network is another org and refuses it, so
          # falling back only trades a clear error for an 18-minute stall.
          secrets: |
            gh_packages_token=${{ secrets.GH_PACKAGES_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Keycloak ECR repository (idempotent)
        run: |
          # Create the repo on first deploy; skip if it already exists. Requires the
          # github-actions-deploy role to allow ecr:CreateRepository on
          # repository/proxy-smart-*. On a permission failure we surface an
          # actionable message rather than a bare AccessDenied.
          if aws ecr describe-repositories --repository-names "$ECR_KEYCLOAK_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "ECR repo $ECR_KEYCLOAK_REPOSITORY already exists — skipping create."
          elif aws ecr create-repository --repository-name "$ECR_KEYCLOAK_REPOSITORY" --region "$AWS_REGION" --image-scanning-configuration scanOnPush=true; then
            echo "Created ECR repo $ECR_KEYCLOAK_REPOSITORY."
          else
            echo "::error::Could not create ECR repo '$ECR_KEYCLOAK_REPOSITORY'. Grant the github-actions-deploy role ecr:CreateRepository on arn:aws:ecr:$AWS_REGION:*:repository/proxy-smart-*."
            exit 1
          fi

      - name: Build and push Keycloak image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.keycloak
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_KEYCLOAK_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_KEYCLOAK_REPOSITORY }}:${{ inputs.app_version }}
          build-args: |
            DEPLOY_ENV=prod
            KC_RELATIVE_PATH=/
          cache-from: type=gha,scope=prod-keycloak
          cache-to: type=gha,mode=max,scope=prod-keycloak

      # Point the Keycloak task definition at the image we just pushed.
      #
      # THE BUG THIS FIXES. The image was built and pushed on every release and
      # then thrown away: nothing ever ran `cdk deploy`, so `keycloakImageUri`
      # was never set, the stack kept resolving to the stock quay.io image, and
      # the `--force-new-deployment` below merely restarted the SAME task
      # definition. Production ran stock Keycloak with no realm import and no
      # proxy-smart theme while CI reported a green deploy.
      #
      # Tagged with the version, never `latest`: with a constant URI the
      # synthesized template is byte-identical each run, CDK reports no changes,
      # and the service never picks the new image up — the same failure in a
      # different disguise.
      # This repo is a bun workspace with no package-lock.json, so `npm ci` cannot
      # work here — deploy/infra is a workspace member and aws-cdk is one of its
      # devDependencies. Install from the root the same way every other workflow
      # does, then run the workspace-local cdk.
      - name: Set up Bun
        uses: ./.github/actions/setup-bun-version
        with:
          checkout: 'false'

      - name: Install infra dependencies
        timeout-minutes: 10
        # --filter scopes the install to deploy/infra (aws-cdk and friends);
        # --frozen-lockfile so a deploy can never quietly resolve something new.
        uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.GH_PACKAGES_TOKEN }}
          args: --filter proxy-smart-infra --frozen-lockfile

      # --exclusively is NOT optional. Without it CDK reports
      #   "Including dependency stacks: ProxySmartDatabase, ProxySmartVpc"
      # and a step whose only job is to move a container image tag becomes a
      # CloudFormation update against the production RDS instance and the VPC.
      # This deploys the Keycloak stack and nothing else.
      #
      # REQUIRES CDK PERMISSIONS ON THE DEPLOY ROLE. github-actions-deploy was
      # scoped for ECR push + ECS update, so a plain cdk deploy fails with
      #   AccessDeniedException: ... not authorized to perform: ssm:GetParameter
      #   on .../cdk-bootstrap/hnb659fds/version
      # It needs, at minimum:
      #   ssm:GetParameter  on arn:aws:ssm:*:*:parameter/cdk-bootstrap/hnb659fds/*
      #   sts:AssumeRole    on arn:aws:iam::*:role/cdk-hnb659fds-*
      - name: Deploy Keycloak stack (points the task definition at the new image)
        working-directory: deploy/infra
        run: |
          bunx cdk deploy ProxySmartKeycloak \
            --exclusively \
            -c region="$AWS_REGION" \
            -c keycloakImageUri="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_KEYCLOAK_REPOSITORY }}:${{ inputs.app_version }}" \
            --require-approval never \
            --progress events

      # Ordering matters and is not incidental: Keycloak must be registered in
      # Cloud Map (step above) BEFORE the backend switches KEYCLOAK_BASE_URL to
      # keycloak.proxy-smart.internal, or the backend starts against a name that
      # does not resolve yet.
      #
      # Also --exclusively. Without it this pulls in ProxySmartDatabase and
      # ProxySmartVpc, turning an env-var change into a CloudFormation update of
      # the production RDS instance.
      - name: Deploy Backend stack (Keycloak URL split — internal vs public)
        working-directory: deploy/infra
        run: |
          bunx cdk deploy ProxySmartBackend \
            --exclusively \
            -c region="$AWS_REGION" \
            --require-approval never \
            --progress events

      - name: Force new ECS deployment
        run: |
          echo "🚀 Forcing new deployment on ECS service..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --query 'service.deployments[0].id' \
            --output text

      - name: Wait for ECS service stability
        run: |
          echo "⏳ Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          echo "✅ ECS service is stable"

      - name: Force new Keycloak ECS deployment
        run: |
          echo "🚀 Forcing new Keycloak deployment..."
          aws ecs update-service \
            --cluster ${{ env.ECS_KEYCLOAK_CLUSTER }} \
            --service ${{ env.ECS_KEYCLOAK_SERVICE }} \
            --force-new-deployment \
            --query 'service.deployments[0].id' \
            --output text

      - name: Wait for Keycloak ECS service stability
        run: |
          echo "⏳ Waiting for Keycloak ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_KEYCLOAK_CLUSTER }} \
            --services ${{ env.ECS_KEYCLOAK_SERVICE }}
          echo "✅ Keycloak ECS service is stable"

      - name: Verify deployment health
        run: |
          echo "🏥 Checking deployment health..."
          MAX_RETRIES=10
          RETRY_DELAY=15

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.API_URL }}/health" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              HEALTH_RESPONSE=$(curl -s "${{ env.API_URL }}/health")
              echo "Response: $HEALTH_RESPONSE"
              exit 0
            fi
            echo "⏳ Health check returned $HTTP_STATUS, retrying in ${RETRY_DELAY}s... (attempt $i/$MAX_RETRIES)"
            sleep $RETRY_DELAY
          done

          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      # /health only proves the proxy is up. The FHIR path is a different dependency — it needs
      # HAPI and its database — and this job ADVERTISES it as fhir_server_url below, so it has to
      # be the thing that was actually checked.
      - name: Verify the FHIR endpoint this deploy advertises
        run: |
          FHIR_URL="${{ env.API_URL }}/proxy-smart-backend/hapi-fhir-server/R4/metadata"
          echo "🔥 $FHIR_URL"
          BODY=$(curl -s -o /tmp/fhir-body -w "%{http_code}" --max-time 30 "$FHIR_URL" || echo "000")

          # 401/403 still prove the proxy reached FHIR; only a 5xx or no answer is this deploy's
          # problem. A missing HAPI database surfaces here as 500, which /health cannot see.
          case "$BODY" in
            2*|401|403) echo "✅ FHIR reachable (HTTP $BODY)" ;;
            *)
              echo "❌ FHIR endpoint returned HTTP $BODY"
              head -c 500 /tmp/fhir-body || true
              exit 1
              ;;
          esac

      - name: Set deployment outputs
        id: outputs
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "fhir_server_url=${{ env.API_URL }}/proxy-smart-backend/hapi-fhir-server/R4" >> $GITHUB_OUTPUT
            echo "keycloak_url=${{ env.KEYCLOAK_URL }}" >> $GITHUB_OUTPUT
            echo "app_url=${{ env.PRODUCTION_URL }}" >> $GITHUB_OUTPUT
            echo "deployment_status=success" >> $GITHUB_OUTPUT
            echo "deployment_target=aws" >> $GITHUB_OUTPUT
          else
            echo "fhir_server_url=" >> $GITHUB_OUTPUT
            echo "keycloak_url=${{ env.KEYCLOAK_URL }}" >> $GITHUB_OUTPUT
            echo "app_url=${{ env.PRODUCTION_URL }}" >> $GITHUB_OUTPUT
            echo "deployment_status=failed" >> $GITHUB_OUTPUT
            echo "deployment_target=aws" >> $GITHUB_OUTPUT
          fi

