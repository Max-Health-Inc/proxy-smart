name: Build & Test

on:
  push:
    branches:
      - "dev/*"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      run_tests:
        description: "Whether to run tests"
        required: false
        type: boolean
        default: true
      fail_on_test_failure:
        description: "Whether to fail the workflow if tests fail"
        required: false
        type: boolean
        default: true
    outputs:
      backend_success:
        description: "Whether backend build was successful"
        value: ${{ jobs.build-and-test.outputs.backend_success }}
      frontend_success:
        description: "Whether frontend build was successful"
        value: ${{ jobs.build-and-test.outputs.frontend_success }}
      backend_tests_success:
        description: "Whether backend tests were successful"
        value: ${{ jobs.build-and-test.outputs.backend_tests_success }}
      frontend_tests_success:
        description: "Whether frontend tests were successful"
        value: ${{ jobs.build-and-test.outputs.frontend_tests_success }}

permissions:
  contents: read
  # Needed so bun can install @max-health-inc/shared-ui from GitHub Packages.
  packages: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Hard cap so a hung step (e.g. a `bun install` waiting on registry/git auth)
    # fails fast instead of running to GitHub's 6h default.
    timeout-minutes: 40
    outputs:
      backend_success: ${{ steps.backend-build.outcome == 'success' || steps.backend-build-heal.outputs.fixed == 'true' }}
      frontend_success: ${{ steps.frontend-build.outcome == 'success' || steps.frontend-build-heal.outputs.fixed == 'true' }}
      backend_tests_success: ${{ steps.backend-test.outcome == 'success' || steps.backend-test-heal.outputs.fixed == 'true' || (inputs.run_tests != true && inputs.run_tests != null) }}
      frontend_tests_success: ${{ steps.frontend-test.outcome == 'success' || steps.frontend-test-heal.outputs.fixed == 'true' || (inputs.run_tests != true && inputs.run_tests != null) }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Bun
      uses: ./.github/actions/setup-bun-version

    # Install Dependencies
    - name: Install Dependencies (Workspace)
      timeout-minutes: 20
      uses: ./.github/actions/bun-install
      with:
        token: ${{ secrets.GH_PACKAGES_TOKEN }}

    # The plugin directories under plugins/ are generated from plugins/source, and the
    # marketplace fetches them straight out of the repo — so a hand-edit here would be served
    # to installers and silently lost on the next build. Cheap, so it runs before the builds.
    - name: Check generated agent plugins
      run: bun run plugins:check

    # === BACKEND BUILD ===
    - name: Build Backend
      run: |
        echo "🔨 Building backend..."
        cd backend
        bun run build
    
    - name: Generate Client APIs
      run: |
        echo "🔨 Generating client APIs..."
        pip install --break-system-packages openapi-ts-fetch==0.2.2
        # `generate` covers every generated client (admin UI + CLI). Both are
        # gitignored, so anything that is not generated here does not exist in
        # CI at all — the CLI used to be silently absent.
        bun run generate

    # === FRONTEND BUILD ===
    - name: Build Frontend
      env:
        TAILWIND_DISABLE_LIGHTNINGCSS: "1"
        VITE_ENCRYPTION_SECRET: ${{ secrets.VITE_ENCRYPTION_SECRET }}
      run: |
        echo "🔨 Building frontend..."
        cd frontend/ui
        bun run build

    # === BACKEND TESTS ===
    - name: Test Backend
      if: ${{ inputs.run_tests == true || inputs.run_tests == null }}
      run: |
        echo "🧪 Testing backend..."
        cd backend
        # `bun run test` uses `bun test --isolate` (see package.json). --isolate
        # gives each test file a fresh global object, so mock.module() (which is
        # process-global and is NOT undone by mock.restore()) can't leak between
        # files. Without it, a file mocking a shared module (e.g. @/lib/auth)
        # leaked into files testing the real one — order-dependent, so it passed
        # locally but failed in CI (Linux readdir order). See bun docs: mocks.
        bun run test

    # === FRONTEND TESTS ===
    - name: Test Frontend
      if: ${{ inputs.run_tests == true || inputs.run_tests == null }}
      env:
        TAILWIND_DISABLE_LIGHTNINGCSS: "1"
      run: |
        echo "🧪 Testing frontend..."
        cd frontend/ui
        bun run test --run

    # === CLI (published from this repo, so it must build and pass here) ===
    - name: Test CLI
      if: ${{ inputs.run_tests == true || inputs.run_tests == null }}
      run: |
        echo "🧪 Testing CLI..."
        cd packages/cli
        bun run typecheck
        bun run test

    # === Shared packages ===
    # @proxy-smart/auth carries the SMART launch/scope logic the backend imports,
    # and its suite was never run here — a change to it could only be verified by
    # hand. Same for elysia-mcp.
    - name: Test Shared Packages
      if: ${{ inputs.run_tests == true || inputs.run_tests == null }}
      run: |
        echo "🧪 Testing shared packages..."
        bun run typecheck:packages
        bun run lint:packages
        bun run test:packages

    # === Docs ===
    # Badges and in-repo links rot without ever failing a build: a version badge
    # advertising an old release, a workflow badge pointing at a renamed file, a
    # nav link outliving its heading. Static only, so no network flake.
    - name: Check Badges and Doc Links
      run: bun run check:badges

    # Fenced ts/tsx examples are compiled against the real packages, so a rename
    # breaks the docs the same way it breaks the code. --min is a ratchet: it
    # only stops coverage falling, and is raised as packages get documented.
    - name: Typecheck Doc Examples
      run: |
        bun run check:docs
        bun run check:docs:coverage

    - name: Upload Build Artifacts
      if: ${{ !startsWith(github.ref, 'refs/heads/dev/') }}
      uses: actions/upload-artifact@v7
      with:
        name: build-artifacts
        path: |
          backend/dist
          frontend/ui/dist
        retention-days: 7
