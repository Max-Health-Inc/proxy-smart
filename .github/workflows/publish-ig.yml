name: Publish FHIR IG package

# Publishes the babelfhir-ts-generated typed package for proxy-smart's OWN
# Consent IG (fhir/, id maxhealth.consent) to GitHub Packages as
# @max-health-inc/consent-fhir, so apps (consent portal, this backend) install
# ONE published package instead of vendoring
# lib/maxhealth.consent-<version>-generated.tgz. Mirrors the dicom-viewer / AIHR
# publish-ig pattern.
#
# Input-driven publish: the build key hashes the FSH SOURCES (fhir/input +
# sushi-config) plus the babelfhir version + flags — NOT the generated output,
# which bakes per-run timestamps into placeholder defaults. Publishes only when
# that key differs from the last published version (auto patch-bump), so a no-op
# push publishes nothing.

on:
  push:
    branches: [main]
    paths:
      - 'fhir/**'
      - '.github/workflows/publish-ig.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PKG_NAME: "@max-health-inc/consent-fhir"
  # Pin to the same babelfhir-ts fhir/build.mjs uses, so the published package is
  # byte-consistent with the previously vendored tgz (drop-in for consumers).
  BABELFHIR_VERSION: "1.5.17"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@max-health-inc"

      - name: Decide whether to publish (build key vs last published)
        id: decide
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Identity = FSH source content + generator version + flags (deterministic;
          # generated output bakes per-run timestamps so can't be hashed directly).
          FSH_HASH=$(find fhir/input fhir/sushi-config.yaml -type f -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          KEY="fsh:${FSH_HASH}|babelfhir@${BABELFHIR_VERSION}|base"
          # tr -d '\r': sushi-config.yaml is CRLF here (.gitattributes *.yaml eol=crlf);
          # a stray carriage return in the version breaks the node -e stamp step below.
          BASE=$(grep -E '^version:' fhir/sushi-config.yaml | head -1 | awk '{print $2}' | tr -d '\r')
          # Exported so the build step names its intermediate FHIR package after
          # the version the IG actually declares, instead of a hardcoded copy.
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "build key: $KEY"

          LATEST=$(npm view "$PKG_NAME" version 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "First publish of $PKG_NAME at IG version $BASE"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$BASE" >> "$GITHUB_OUTPUT"
          else
            PUB_KEY=$(npm view "$PKG_NAME@$LATEST" _igBuildKey 2>/dev/null || true)
            if [ "$PUB_KEY" = "$KEY" ]; then
              echo "IG unchanged (same FSH + generator + flags as $LATEST) — skipping."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              HIGHER=$(npx --yes semver "$BASE" "$LATEST" | tail -1)
              if [ "$HIGHER" = "$BASE" ] && [ "$BASE" != "$LATEST" ]; then
                VER="$BASE"
              else
                VER=$(npx --yes semver -i patch "$LATEST")
              fi
              echo "IG changed — publishing $PKG_NAME@$VER (was $LATEST)"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "version=$VER" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Compile FSH (SUSHI) + generate typed package
        if: steps.decide.outputs.publish == 'true'
        env:
          # The IG's own version, read from sushi-config.yaml in the decide step.
          # Only names the intermediate FHIR package; the PUBLISHED npm version is
          # steps.decide.outputs.version, stamped below.
          IG_VERSION: ${{ steps.decide.outputs.base }}
        run: |
          # SUSHI emits fsh-generated/resources/ (not a package/ dir), so assemble a
          # FHIR NPM package ourselves: resources + a manifest (canonical lets
          # babelfhir resolve the base R4 profiles). Then babelfhir-ts install
          # --skip-install packs lib/<pkg>-generated.tgz.
          (cd fhir && npx --yes fsh-sushi@latest .)
          rm -rf fhir/pkg && mkdir -p fhir/pkg
          cp fhir/fsh-generated/resources/*.json fhir/pkg/
          node -e "const fs=require('fs');fs.writeFileSync('fhir/pkg/package.json',JSON.stringify({name:'maxhealth.consent',version:'${IG_VERSION}',canonical:'https://maxhealth.tech/fhir/consent',fhirVersions:['4.0.1'],type:'fhir.ig'},null,2))"
          tar -czf "fhir/maxhealth.consent-${IG_VERSION}.tgz" -C fhir/pkg .
          # babelfhir caches the extracted package under name@version and reuses it;
          # a hosted runner is always cold, but clear it anyway so a self-hosted or
          # retried runner cannot generate from a previous run's FSH.
          rm -rf "$HOME/.fhir/packages/maxhealth.consent@${IG_VERSION}"
          npx --yes babelfhir-ts@${BABELFHIR_VERSION} install "./fhir/maxhealth.consent-${IG_VERSION}.tgz" --skip-install --fhir-version r4 || true
          rm -rf dist-ig && mkdir dist-ig
          tar xzf "lib/maxhealth.consent-${IG_VERSION}-generated.tgz" -C dist-ig --strip-components=1

      - name: Stamp name / version / build key
        if: steps.decide.outputs.publish == 'true'
        run: |
          node -e "const fs=require('fs'),f='dist-ig/package.json',p=JSON.parse(fs.readFileSync(f));p.name='${{ env.PKG_NAME }}';p.version='${{ steps.decide.outputs.version }}';p._igBuildKey='${{ steps.decide.outputs.key }}';p.publishConfig={registry:'https://npm.pkg.github.com'};p.repository={type:'git',url:'https://github.com/Max-Health-Inc/proxy-smart.git'};fs.writeFileSync(f,JSON.stringify(p,null,2))"

      - name: Publish to GitHub Packages
        if: steps.decide.outputs.publish == 'true'
        working-directory: dist-ig
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
